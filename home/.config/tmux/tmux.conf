# Set prefix to Ctrl-a instead of default Ctrl-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Set window and pane index to start at 1
set -g base-index 1
setw -g pane-base-index 1

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# tmux's built-in pane and window keys get the same -c, so no route to a new
# pane or window lands in $HOME by accident. -c opens it in the current pane's
# directory; without it tmux uses the session's starting directory, which is
# $HOME because that is where the shell that launched tmux was.
bind % split-window -h -c "#{pane_current_path}"
bind \" split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# navigate with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# thicken pane borders
set -g pane-border-lines double

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

