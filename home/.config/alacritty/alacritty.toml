# https://alacritty.org/config-alacritty.html

[window]
dimensions = { columns = 120, lines = 30 }
dynamic_title = true
opacity = 0.97
blur = false # unix only

[font]
normal = { family = "FiraCode Nerd Font", style = "Medium" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Regular" }
bold_italic = { family = "FiraCode Nerd Font", style = "Regular" }
size = 14
builtin_box_drawing = false

[terminal]
#shell = { program = "/usr/bin/zsh", args = ["-l",] }
#osc52 = "CopyPaste"

[general]
live_config_reload = true
working_directory = "/home/robin/"
import = ["~/.config/alacritty/tokyonight_night.toml"]
